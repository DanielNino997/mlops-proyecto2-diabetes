apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: mlops
data:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_S3_ENDPOINT_URL: http://minio:9000
  MODEL_NAME: diabetes-readmission
  MODEL_ALIAS: champion
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-api
  namespace: mlops
  labels: {app: inference-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: inference-api}
  template:
    metadata:
      labels: {app: inference-api}
    spec:
      containers:
        - name: api
          image: dnino97/diabetes-api:1.0
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: api-config}
            - secretRef: {name: postgres-secret}
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: minio-secret, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: minio-secret, key: AWS_SECRET_ACCESS_KEY}}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits:   {cpu: "1",  memory: 1Gi}
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: inference-api
  namespace: mlops
spec:
  selector: {app: inference-api}
  ports:
    - {name: http, port: 8000, targetPort: 8000}