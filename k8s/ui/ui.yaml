apiVersion: v1
kind: ConfigMap
metadata:
  name: ui-config
  namespace: mlops
data:
  API_URL: http://inference-api:8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit
  namespace: mlops
  labels: {app: streamlit}
spec:
  replicas: 1
  selector:
    matchLabels: {app: streamlit}
  template:
    metadata:
      labels: {app: streamlit}
    spec:
      containers:
        - name: streamlit
          image: dnino97/diabetes-ui:1.0
          ports:
            - containerPort: 8501
          envFrom:
            - configMapRef: {name: ui-config}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits:   {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /_stcore/health, port: 8501}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /_stcore/health, port: 8501}
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: streamlit
  namespace: mlops
spec:
  selector: {app: streamlit}
  ports:
    - port: 8501
      targetPort: 8501